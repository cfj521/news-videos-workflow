# 新闻视频自动化工作流 —— 单容器一体化部署
#
# 一个容器同时托管前端(静态)与后端(API + 进程内流水线)，单端口访问。
#
# 首次使用：
#   1) bash docker/setup.sh                 # 从 .example 模板创建 7 个 YAML（防 bind mount 目录陷阱）
#   2) cp .env.example .env  并按需修改端口 / ComfyUI 地址 / 时区
#   3) docker compose up -d --build
#   4) 浏览器打开 http://localhost:8189 （或 .env 里设的 APP_PORT；默认登录 admin / admin）
#
# 说明：流水线跑在进程内的后台任务，无需独立 worker/broker。
#      ComfyUI 需 GPU + 模型，建议留在宿主机，容器经 host.docker.internal 访问。

services:
  app:
    build:
      context: .
      args:
        WITH_PUBLISH: ${WITH_PUBLISH:-0}
    image: nvw-app
    container_name: nvw-app
    restart: unless-stopped
    environment:
      # 监听端口（注入容器，Dockerfile CMD 读取）；前后端同一端口
      APP_PORT: ${APP_PORT:-8189}
      # 覆盖 config.yaml 的 comfyui.server_url（容器内不能用 127.0.0.1 连宿主 ComfyUI）
      NV_COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      # 计划任务时区（tzlocal 跟随系统时区）
      TZ: ${TZ:-Asia/Shanghai}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 容器内访问宿主机服务（如 ComfyUI）
    ports:
      - "${APP_PORT:-8189}:${APP_PORT:-8189}"   # 浏览器入口 = API 入口，单端口
    volumes:
      # 7 个配置 YAML（含密钥：挂载而非打进镜像）
      - ./config.yaml:/app/config.yaml
      - ./model_providers.yaml:/app/model_providers.yaml
      - ./news_sources.yaml:/app/news_sources.yaml
      - ./publish_targets.yaml:/app/publish_targets.yaml
      - ./schedule.yaml:/app/schedule.yaml
      - ./prompts.yaml:/app/prompts.yaml
      - ./covers.yaml:/app/covers.yaml
      # SQLite 库 + .auth_secret + 运行产物 + 封面图 + 日志，持久化
      - ./data:/app/data
      # 抖音/快手登录态（social-auto-upload cookie）
      - ./publish_cookies:/app/publish_cookies
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os,sys; p=os.getenv('APP_PORT','8189'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{p}/api/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
