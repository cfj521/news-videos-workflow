[project]
name = "news-videos-workflow"
version = "0.1.0"
description = "新闻视频自动化工作流系统"
requires-python = ">=3.12"
# 依赖统一在仓库根 requirements.txt 管理（conda 环境用 pip install -r requirements.txt）。
# 本文件只保留项目元信息与工具配置（ruff / pytest）。

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
tmp_path_retention_policy = "none"
# 用仓库内可写目录作 tmp_path 基址，避免系统 %TEMP% 下陈旧/受限目录导致 PermissionError
addopts = "--basetemp=.pytest_tmp"
